[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Lexitron"
version = "4.1.0"
authors = [
    {name = "Rothos"}
]
description = "A command-line regex search engine for the English language"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["english", "dictionary", "crossword", "spelling", "words", "lexicon", "search", "anagram", "scrabble", "wordle", "spelling bee", "regex", "rhymes", "rhyming dictionary"]
license = {text = "GNU GPL Version 2"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rothos/lexitron"

[tool.setuptools]
zip-safe = false
packages = ["lexitron"]

[tool.setuptools.package-data]
lexitron = ["words.tsv.gz", "SCOWL-Copyright.txt", "pronunciations.tsv.gz", "CMUdict-License.txt"]

[project.scripts]
lx = "lexitron.lexitron:main"
ry = "lexitron.rhymes:main"
