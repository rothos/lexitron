[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Lexitron"
version = "3.0.0"
authors = [
    {name = "Rothos"}
]
description = "A command-line regex search engine for the English language"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["english", "dictionary", "crossword", "spelling", "words", "lexicon", "search"]
license = {text = "GNU GPL Version 2"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "http://github.com/rothos/lexitron"

[tool.setuptools]
zip-safe = false
packages = ["lexitron"]

[tool.setuptools.package-data]
lexitron = ["words.tsv.gz", "SCOWL-Copyright.txt"]

[project.scripts]
lx = "lexitron.lexitron:main"
